<section class="public-profile" aria-label="Tu perfil público">
  <div class="public-profile-person">
    <span class="avatar avatar-large">{{ initials }}</span>
    <div>
      <p class="eyebrow">Tu perfil público</p>
      <h2>{{ fullName }}</h2>
      <p class="profile-city">{{ user().email }}</p>
    </div>
  </div>

  <span class="role-badge">Inquilino</span>

  <p class="public-profile-copy">
    Construye una reputación que puedas llevar contigo en cada alquiler.
  </p>

  <a class="profile-button" routerLink="/inquilino/perfil">
    <span>Ver mi perfil</span>
    <span class="profile-button-arrow" aria-hidden="true">→</span>
  </a>
</section>
