@if (isLoading) {
  <main class="dashboard-main" aria-live="polite">
    <p>Cargando tu perfil...</p>
  </main>
} @else if (hasError || !user) {
  <main class="dashboard-main" aria-live="polite">
    <p>No hemos podido cargar tu perfil.</p>
    <p>Comprueba tu sesión e inténtalo de nuevo.</p>
  </main>
} @else {
  <app-tenant-hero [user]="user" />
}
