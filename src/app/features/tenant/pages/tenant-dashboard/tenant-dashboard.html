<main class="dashboard-main">
  @if (isLoading()) {
    <p class="dashboard-message" aria-live="polite">
      Cargando tu perfil...
    </p>
  } @else if (hasError()) {
    <div class="dashboard-message" role="alert">
      <p>No hemos podido cargar tu perfil.</p>
      <p>Comprueba tu sesión e inténtalo de nuevo.</p>
    </div>
  } @else if (user(); as profile) {
    <app-tenant-hero [user]="profile" />
    <app-tenant-experiences
      [experiences]="experiences()"
      [loading]="isExperiencesLoading()"
      [hasError]="hasExperiencesError()"
    />
    <app-tenant-profile-public-section [user]="profile" />
  } @else {
    <div class="dashboard-message" role="alert">
      <p>No hemos podido cargar tu perfil.</p>
    </div>
  }
</main>
