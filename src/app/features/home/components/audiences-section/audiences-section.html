<section
  id="audiences"
  class="audiences"
  aria-label="HouseKarma para inquilinos y caseros"
>
  <article class="audiences__panel audiences__panel--tenant">
    <p class="audiences__eyebrow">
      Un hogar con contexto
    </p>

    <div class="audiences__content">
      <h2 class="audiences__title">
        Inquilinos
      </h2>

      <p class="audiences__description">
        Conoce la reputación de los caseros antes de alquilar.
      </p>

      <button
        class="audiences__cta"
        type="button"
        aria-label="Soy inquilino"
      >
        <span>Soy inquilino</span>

        <svg
          class="audiences__arrow"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
      </button>
    </div>
  </article>

  <article class="audiences__panel audiences__panel--landlord">
    <p class="audiences__eyebrow">
      Confianza que permanece
    </p>

    <div class="audiences__content">
      <h2 class="audiences__title">
        Caseros
      </h2>

      <p class="audiences__description">
        Construye una reputación basada en tus experiencias.
      </p>

      <button
        class="audiences__cta"
        type="button"
        aria-label="Soy casero"
      >
        <span>Soy casero</span>

        <svg
          class="audiences__arrow"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
      </button>
    </div>
  </article>
</section>
