<header class="header">
  <a class="logo" href="#inicio" aria-label="HouseKarma, ir al inicio" (click)="closeMenu()">
    House<span>Karma</span>
  </a>

  <button
    class="menu-toggle"
    type="button"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="main-navigation"
    [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    (click)="toggleMenu()"
  >
    <span class="sr-only">Menú</span>
    <span></span>
    <span></span>
  </button>

  <nav
    id="main-navigation"
    class="navigation"
    [class.navigation--open]="menuOpen()"
    aria-label="Navegación principal"
  >
    <a routerLink="/" fragment="como-funciona" (click)="closeMenu()"> Cómo funciona </a>

    <a routerLink="/" fragment="reputacion" (click)="closeMenu()"> Reputación </a>

    <a routerLink="/" fragment="audiences" (click)="closeMenu()"> Para inquilinos </a>

    <a routerLink="/" fragment="audiences" (click)="closeMenu()"> Para caseros </a>

    <div class="actions">
      <a
        class="login-link"
        routerLink="/login"
        aria-label="Iniciar sesión"
        title="Iniciar sesión"
        (click)="closeMenu()"
      >
        <svg lucideUserRound class="user-icon" aria-hidden="true"></svg>
      </a>

      <a class="register-link" routerLink="/register" (click)="closeMenu()"> Registrarse </a>
    </div>
  </nav>
</header>
