
<header class="header">
  <a
    class="logo"
    href="#inicio"
    aria-label="HouseKarma, ir al inicio"
    (click)="closeMenu()"
  >
    House<span>Karma</span>
  </a>

  <button
    class="menu-toggle"
    type="button"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="main-navigation"
    [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    (click)="toggleMenu()"
  >
    <span class="sr-only">Menú</span>
    <span></span>
    <span></span>
  </button>

  <nav
    id="main-navigation"
    class="navigation"
    [class.navigation--open]="menuOpen()"
    aria-label="Navegación principal"
  >
    <a href="#como-funciona" (click)="closeMenu()">Cómo funciona</a>
    <a href="#reputacion" (click)="closeMenu()">Reputación</a>
    <a href="#inquilinos" (click)="closeMenu()">Para inquilinos</a>
    <a href="#caseros" (click)="closeMenu()">Para caseros</a>

    <div class="actions">
      <a class="login-link" href="/login" (click)="closeMenu()">
        Iniciar sesión
      </a>

      <a class="register-link" href="/register" (click)="closeMenu()">
        Registrarse
      </a>
    </div>
  </nav>
</header>
