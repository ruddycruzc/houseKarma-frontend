<section
  class="rental-story"
  aria-labelledby="rental-story-title"
>
  <div class="rental-story__intro">
    <p class="rental-story__eyebrow">
      Una relación, una historia
    </p>

    <h2
      id="rental-story-title"
      class="rental-story__title"
    >
      El alquiler también deja huella.
    </h2>

    <p class="rental-story__description">
      Cada alquiler crea una historia entre personas.
      HouseKarma transforma esa experiencia compartida
      en una señal de confianza para el futuro.
    </p>
  </div>

  <div
    class="rental-story__diagram"
    role="img"
    aria-label="El inquilino y el casero comparten una experiencia a través de la vivienda, que genera confianza."
  >
    <article class="story-card story-card--tenant">
      <span class="story-card__number">01</span>
      <h3 class="story-card__title">Inquilino</h3>
    </article>

    <div
      class="story-connection story-connection--experience"
      aria-hidden="true"
    >
      <span class="story-connection__label">
        Experiencia
      </span>
    </div>

    <article class="story-card story-card--home">
      <span class="story-card__number">02</span>
      <h3 class="story-card__title">Vivienda</h3>
    </article>

    <div
      class="story-connection story-connection--trust"
      aria-hidden="true"
    >
      <span class="story-connection__label">
        Confianza
      </span>
    </div>

    <article class="story-card story-card--landlord">
      <span class="story-card__number">03</span>
      <h3 class="story-card__title">Casero</h3>
    </article>
  </div>
</section>
