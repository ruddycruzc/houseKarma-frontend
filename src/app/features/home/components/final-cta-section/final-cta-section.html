<section
  class="final-cta"
  aria-labelledby="final-cta-title"
>
  <div class="final-cta__content">
    <p class="final-cta__eyebrow">
      Tu próxima experiencia empieza aquí
    </p>

    <h2
      id="final-cta-title"
      class="final-cta__title"
    >
      Construye una reputación que te acompañe.
    </h2>

    <p class="final-cta__description">
      Únete a HouseKarma y convierte tus experiencias de
      alquiler en confianza.
    </p>

    <div class="final-cta__actions">
      <button
        class="final-cta__button final-cta__button--primary"
        type="button"
        aria-label="Crear cuenta"
      >
        <span>Crear cuenta</span>

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
      </button>

      <button
        class="final-cta__button final-cta__button--secondary"
        type="button"
        aria-label="Iniciar sesión"
      >
        <span>Iniciar sesión</span>

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
      </button>
    </div>
  </div>
</section>
